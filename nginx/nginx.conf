# nginx site config for the web image (copied to /etc/nginx/conf.d/default.conf, which nginx
# loads inside its `http { ... }` block). nginx is the only thing the browser talks to: it
# serves the built UI and forwards API and Socket.IO traffic to the API service.

# The API servers nginx can forward to. "api" is the compose service name; Docker's DNS turns
# it into the container's address. One server for now; more are added in the pub/sub slice
# (Socket.IO will then need sticky sessions, e.g. `ip_hash`, so a client keeps one server).
upstream api_upstream {
    server api:4000;
}

# WebSocket helper: when the browser asks to upgrade the connection ("Upgrade: websocket"),
# pass "Connection: upgrade" on to the API; otherwise close the upstream connection normally.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The UI. Real files (JS, CSS, images) are served as they are; any other path falls back
    # to index.html so client-side routes (added with the UI port) load the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API. Forwarded as-is, telling the API who the real client is and which protocol
    # and host they used (nginx is in between, so the API would otherwise only see nginx).
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO. Starts as normal HTTP (long polling) and then upgrades to a WebSocket, which
    # needs HTTP/1.1 plus the Upgrade/Connection headers. A WebSocket stays open for a long
    # time, so the read timeout is long (Socket.IO pings every ~25 s to keep it alive).
    location /socket.io/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
