# Self-contained app: docker compose up --build -> http://localhost:3000
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: quarrel
      POSTGRES_PASSWORD: quarrel
      POSTGRES_DB: quarrel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarrel -d quarrel"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: api
    env_file: .env.local
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://quarrel:quarrel@postgres:5432/quarrel
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: worker
    env_file: .env.local
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://quarrel:quarrel@postgres:5432/quarrel
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
